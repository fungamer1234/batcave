<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATCAVE // PLAY</title>
  <link rel="icon" href="images/emblem.jpg">
  <link rel="stylesheet" href="css/batcave.css">
</head>
<body>
  <div class="bg"></div>
  <header class="top">
    <a class="brand" href="index.html">
      <img src="images/emblem.jpg" alt="Batcave emblem">
      <div>
        <h1>BATCAVE</h1>
        <small>MISSION ACTIVE</small>
      </div>
    </a>
    <div class="search">
      <input id="q" type="search" placeholder="Jump to another game..." autocomplete="off">
    </div>
  </header>

  <main class="wrap play-shell">
    <div class="play-bar">
      <h2 id="title">Loading...</h2>
      <div class="actions">
        <a class="btn" href="index.html">Back to cave</a>
        <a class="btn" id="school" target="_blank" rel="noopener">Play on school network</a>
        <a class="btn solid" id="open" target="_blank" rel="noopener">Open full game</a>
      </div>
    </div>
    <div class="stage">
      <iframe id="frame" title="Game" allowfullscreen allow="autoplay; fullscreen; gamepad; pointer-lock" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms allow-modals"></iframe>
    </div>
    <p class="note" id="note">UGS games load from the public GitHub stash. If the screen stays black, use the buttons above.</p>
  </main>

  <script src="js/games.js"></script>
  <script>
    const CDN = "https://cdn.jsdelivr.net/gh/brickyosu/ugs-files-sorted@main/";
    const params = new URLSearchParams(location.search);
    const id = params.get("g");
    const game = (window.BATCAVE_GAMES || []).find(g => g.id === id);
    const title = document.getElementById("title");
    const frame = document.getElementById("frame");
    const open = document.getElementById("open");
    const school = document.getElementById("school");
    const note = document.getElementById("note");
    const q = document.getElementById("q");

    function fileUrl(file) {
      return CDN + file.split("/").map(encodeURIComponent).join("/");
    }

    async function play(game) {
      document.title = "BATCAVE // " + game.title;
      title.textContent = game.title;
      school.href = game.schoolUrl || "https://sites.google.com/view/classroom6x/";

      if (game.file) {
        const url = fileUrl(game.file);
        open.href = url;
        note.textContent = "Loading UGS file: " + game.file;
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error("fetch " + res.status);
          const html = await res.text();
          const blob = new Blob([html], { type: "text/html" });
          frame.src = URL.createObjectURL(blob);
          note.textContent = "Playing from UGS stash. If it stays black, open the full game.";
        } catch (err) {
          note.textContent = "UGS file blocked here. Opening classroom6x instead.";
          frame.removeAttribute("sandbox");
          frame.src = game.school && game.schoolUrl ? game.schoolUrl : game.url;
          open.href = game.url;
        }
        return;
      }

      open.href = game.url;
      frame.removeAttribute("sandbox");
      frame.src = game.url;
      note.textContent = "This title is not in the UGS stash. Opening classroom6x.";
    }

    if (!game) {
      title.textContent = "Signal lost";
      open.href = "index.html";
      open.textContent = "Return to cave";
      school.href = "https://sites.google.com/view/classroom6x/";
    } else {
      play(game);
    }

    q.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const term = q.value.trim().toLowerCase();
      const hit = (window.BATCAVE_GAMES || []).find(g => g.title.toLowerCase().includes(term) || g.id.includes(term.replace(/\s+/g, "-")));
      if (hit) location.href = "play.html?g=" + encodeURIComponent(hit.id);
    });
  </script>
</body>
</html>
