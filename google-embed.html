<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BATCAVE</title><style>
:root{--g:#d4af37;--g2:#f3d675;--ink:#07080c;--txt:#efe8d6;--mut:#9a917c;--line:rgba(212,175,55,.28)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050608;color:var(--txt);font-family:Trebuchet MS,Segoe UI,Helvetica,sans-serif}
body{background:radial-gradient(900px 400px at 50% -10%,rgba(212,175,55,.14),transparent 55%),#050608}
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 14px;background:rgba(7,8,12,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.brand{display:flex;gap:10px;align-items:center}
.brand img{width:42px;height:42px;border-radius:50%;border:1px solid var(--g)}
.brand h1{margin:0;letter-spacing:.28em;font-size:18px;color:var(--g2)}
.brand small{display:block;letter-spacing:.14em;color:var(--mut);font-size:9px}
.search{flex:1}
.search input{width:100%;padding:10px 12px;border-radius:999px;border:1px solid var(--line);background:#12151d;color:var(--txt);outline:none}
.hero{padding:28px 16px 10px;text-align:center}
.hero h2{margin:8px 0 6px;letter-spacing:.22em;color:var(--g2);font-size:42px}
.hero p{margin:0 auto;max-width:640px;color:#ddd4bc;line-height:1.5}
.wrap{width:min(1100px,calc(100% - 24px));margin:0 auto;padding:12px 0 40px}
.cats,.az{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
button{background:#12151d;color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:7px 10px;cursor:pointer}
button.active{background:var(--g);color:#120f07;font-weight:700}
.az button{min-width:32px;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:block;background:rgba(10,12,18,.86);border:1px solid var(--line);border-radius:12px;padding:16px 10px 12px;text-decoration:none;color:var(--txt);min-height:92px}
.card:hover{border-color:var(--g);transform:translateY(-3px)}
.card b{display:block;color:var(--g);font-size:11px;letter-spacing:.08em;margin-bottom:6px}
.card span{font-size:13px;line-height:1.3}
.stage{display:none;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000;min-height:70vh}
.stage.on{display:block}
.stage iframe{width:100%;height:72vh;border:0}
.note{color:var(--mut);font-size:12px;margin:10px 0 0}
.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{display:inline-block;padding:8px 12px;border:1px solid var(--g);border-radius:10px;color:var(--g2);text-decoration:none}
</style></head>

const CDN='https://cdn.jsdelivr.net/gh/brickyosu/ugs-files-sorted@main/';
const b64=DATA;
async function loadGames(){
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const stream=new Blob([bin]).stream().pipeThrough(ds);
  const buf=await new Response(stream).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(buf));
}
function fileUrl(file){return CDN+file.split('/').map(encodeURIComponent).join('/');}
let GAMES=[], cat='all', letter='all';
function filtered(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  return GAMES.filter(r=>{
    const [id,title,file,school,cats]=r;
    if(cat==='school' && !school) return false;
    if(cat==='ugs' && !file) return false;
    if(cat!=='all' && cat!=='school' && cat!=='ugs' && !(cats||'').split(',').includes(cat)) return false;
    const first=(title.replace(/^[^A-Za-z0-9]+/,'')[0]||'').toUpperCase();
    if(letter==='0-9' && !/[0-9]/.test(first)) return false;
    if(letter!=='all' && letter!=='0-9' && first!==letter) return false;
    if(!q) return true;
    return title.toLowerCase().includes(q) || id.includes(q.replace(/\s+/g,'-'));
  });
}
function render(){
  const list=filtered();
  document.getElementById('count').textContent=list.length+' / '+GAMES.length;
  document.getElementById('grid').innerHTML=list.map((r,i)=>{
    const [id,title,file,school]=r;
    const tag=file?'UGS':(school?'SCHOOL':'6X');
    return `<a class="card" href="#play/${encodeURIComponent(id)}"><b>${tag}</b><span>${title}</span></a>`;
  }).join('');
}
function openGame(id){
  const r=GAMES.find(x=>x[0]===id);
  if(!r) return;
  const [gid,title,file,school]=r;
  document.getElementById('playTitle').textContent=title;
  document.getElementById('grid').style.display='none';
  document.getElementById('filters').style.display='none';
  document.getElementById('stageWrap').classList.add('on');
  document.getElementById('stageWrap').style.display='block';
  const schoolBtn=document.getElementById('schoolBtn');
  const openBtn=document.getElementById('openBtn');
  schoolBtn.href=school||'https://sites.google.com/view/classroom6x/';
  schoolBtn.target='_top';
  const frame=document.getElementById('frame');
  if(file){
    const url=fileUrl(file);
    openBtn.href=url; openBtn.target='_blank';
    fetch(url).then(res=>res.text()).then(html=>{
      const blob=new Blob([html],{type:'text/html'});
      frame.src=URL.createObjectURL(blob);
    }).catch(()=>{
      window.top.location.href=school||'https://sites.google.com/view/classroom6x/';
    });
  } else if(school){
    window.top.location.href=school;
  } else {
    window.top.location.href='https://sites.google.com/view/classroom6x/';
  }
}
function home(){
  location.hash='';
  document.getElementById('grid').style.display='grid';
  document.getElementById('filters').style.display='block';
  document.getElementById('stageWrap').style.display='none';
}
function route(){
  const m=location.hash.match(/^#play\/(.+)$/);
  if(m) openGame(decodeURIComponent(m[1])); else home();
}
loadGames().then(data=>{
  GAMES=data;
  document.getElementById('total').textContent=data.length+' GAMES';
  document.getElementById('cats').innerHTML=['all','ugs','school','featured','action','racing','sports','shooting','platform','puzzle','stickman','io','minecraft','horror','idle','arcade'].map(c=>`<button data-c="${c}" class="${c==='all'?'active':''}">${c}</button>`).join('');
  document.getElementById('az').innerHTML=['all',... 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),'0-9'].map(l=>`<button data-l="${l}">${l==='all'?'A–Z':l}</button>`).join('');
  document.getElementById('cats').onclick=e=>{
    const b=e.target.closest('button'); if(!b) return; cat=b.dataset.c;
    [...document.getElementById('cats').children].forEach(x=>x.classList.toggle('active',x===b));
    render();
  };
  document.getElementById('az').onclick=e=>{
    const b=e.target.closest('button'); if(!b) return; letter=b.dataset.l;
    [...document.getElementById('az').children].forEach(x=>x.classList.toggle('active',x===b));
    render();
  };
  document.getElementById('q').oninput=render;
  addEventListener('hashchange',route);
  render(); route();
});
</script>
</body></html>
